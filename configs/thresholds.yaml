threshold_sweep: [1, 8, 32, 128, 512, 2048, 8192, 16384]
default:
  cuda: 2048
  cpu: 8192
fallback_when_k_exceeds_threshold: true
k_buckets:
  - { name: "K=1", min: 1, max: 1 }
  - { name: "K<=8", min: 2, max: 8 }
  - { name: "K<=32", min: 9, max: 32 }
  - { name: "K<=128", min: 33, max: 128 }
  - { name: "K<=512", min: 129, max: 512 }
  - { name: "K<=2048", min: 513, max: 2048 }
  - { name: "K<=8192", min: 2049, max: 8192 }
  - { name: "K>8192", min: 8193, max: null }

